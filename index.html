<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kelajak Markazlari Test Tizimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}

/* Layout: sticky top bar, centered 960px column; home = mode cards + sections, exam = question card + question map (bottom sheet on phones), dashboard = readiness gauge + charts */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eaeef2; --ink:#14212b; --muted:#566574; --line:#d5dce3;
  --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#d6efec;
  --good:#1e7b45; --good-soft:#d8f0e2; --bad:#b3362b; --bad-soft:#f8dedb; --warn:#9a6700; --warn-soft:#f6e8c4;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#17222b; --surface2:#1f2d38; --ink:#e6edf2; --muted:#9fb0bd; --line:#2c3b47;
  --accent:#3cc2b8; --accent-ink:#06211f; --accent-soft:#17403e;
  --good:#5fd08c; --good-soft:#173a29; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#e6b84d; --warn-soft:#3d3115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#17222b; --surface2:#1f2d38; --ink:#e6edf2; --muted:#9fb0bd; --line:#2c3b47;
  --accent:#3cc2b8; --accent-ink:#06211f; --accent-soft:#17403e;
  --good:#5fd08c; --good-soft:#173a29; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#e6b84d; --warn-soft:#3d3115; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin-inline:auto;padding-block:20px 40px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin-inline:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.9rem}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.user{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}
.user span{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* login */
.login{min-height:70vh;display:grid;place-items:center}
.login .card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px;padding:28px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-weight:600;min-height:48px}
.gbtn:hover{border-color:var(--accent)}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:56px}
.acct:hover{border-color:var(--accent)}
.acct div{min-width:0}.acct b,.acct small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.field input{padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;min-height:44px;width:100%}
.err{color:var(--bad);font-size:.9rem}
/* home */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:20px}
.hero h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.mini{display:flex;gap:16px;flex-wrap:wrap}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px}
.mini b{font-family:var(--font-display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.mini small{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-block:12px 28px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode h3{font-size:1.15rem}
.mode .big{font-family:var(--font-display);font-size:2.2rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.mode .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:auto}
.secs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sec{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sec h3{font-size:1.02rem}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.resume{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
/* exam */
.ex-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:15;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ex-head-in{max-width:960px;margin-inline:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--font-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1;min-width:120px}
.prog small{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-body{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:18px;align-items:start}
.qcard{display:flex;flex-direction:column;gap:16px}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.4}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:30px;height:30px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-family:var(--font-display)}
.opt .t{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .k{background:var(--bad);color:#fff}
.nav2{display:flex;gap:10px;flex-wrap:wrap}
.nav2 .sp{flex:1}
.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.map h3{font-size:1rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;max-height:48vh;overflow:auto;padding:2px}
.gn{aspect-ratio:1;min-height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;position:relative;padding:0}
.gn.done{background:var(--accent-soft);border-color:var(--accent)}
.gn.flag::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.gn.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.mapbtn{display:none}
.sheet-bg{display:none}
@media (max-width:760px){
  .ex-body{grid-template-columns:minmax(0,1fr)}
  .map{display:none}
  .map.open{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .map.open .grid{max-height:40vh}
  .sheet-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .mapbtn{display:inline-flex}
  .nav2 .btn{flex:1}
  .nav2 .sp{display:none}
  .user span{display:none}
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.res-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;width:100%}
.stats div{background:var(--surface2);border-radius:8px;padding:10px 12px}
.stats b{display:block;font-family:var(--font-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted)}
.rev{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ritem{display:flex;flex-direction:column;gap:8px}
.ritem .opt{cursor:default;min-height:0;padding:8px 12px}
.expl{font-size:.92rem;background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:760px){.dash{grid-template-columns:minmax(0,1fr)}}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gauge svg{width:100%;max-width:240px}
.level{font-weight:700;padding:4px 14px;border-radius:99px;background:var(--accent-soft)}
.secrow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 12px;margin-bottom:14px}
.secrow .bar{height:10px}
.secrow b{text-align:right;font-variant-numeric:tabular-nums}
.secrow small{grid-column:1/-1;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:80;font-weight:600}
@media (prefers-reduced-motion:no-preference){.mode{transition:transform .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>

const SECS=[
 {id:1,name:"Kelajak markazlari va ta’lim siyosati",short:"Ta’lim siyosati"},
 {id:2,name:"Rahbarlik va menejment",short:"Rahbarlik"},
 {id:3,name:"Qonunchilik",short:"Qonunchilik"},
 {id:4,name:"Pedagogika va psixologiya",short:"Pedagogika"},
 {id:5,name:"Mantiqiy va vaziyatli savollar",short:"Mantiqiy"}];
let QS=[];
const CFG=window.APP_CONFIG;
const L=['A','B','C','D'];
const COLORS=['#0b7a75','#8a5a00','#5b4bb7','#b3362b','#2a6fb0','#3d7a2a'];

/* ---------- storage (try/catch, memory fallback) ---------- */
const mem={};
const st={get(k){try{const v=localStorage.getItem(k);return v==null?(mem[k]??null):JSON.parse(v)}catch(e){return mem[k]??null}},
 set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
let me=null, price=0, booting=true, qLoading=false;
let token=st.get('kmt_token')||null;
const dkey=()=>'kmt_data_'+me.email;
async function api(path,opt={}){
  const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(CFG.API_BASE+path,{...opt,headers:h});
  let data={};try{data=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(data.error||'Xatolik');e.status=r.status;throw e}
  return data;
}
let D=null;
function loadData(){D=st.get(dkey())||{attempts:[],latest:{}};}
function saveData(){st.set(dkey(),D)}
function colorFor(email){let h=0;for(const c of email)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
let view='login', exam=null, result=null, tick=null, modal=null, resFilter='all', mapOpen=false, toastT=null, loginMsg='';
const $=document.getElementById('app');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* balanced A-D placement of the correct answer across the exam */
function buildItems(qs){
  let slots=[];while(slots.length<qs.length)slots=slots.concat(shuffle([0,1,2,3]));
  slots=shuffle(slots.slice(0,qs.length));
  return qs.map((q,i)=>{
    const wrong=shuffle([0,1,2,3].filter(x=>x!==q.a));const pos=slots[i];
    const order=[];let w=0;for(let p=0;p<4;p++)order.push(p===pos?q.a:wrong[w++]);
    return {id:q.id,order,ans:-1,flag:false};});
}
const MODES={
 r50:{title:"50 ta random test",n:50,min:60,desc:"400 savoldan 50 ta tasodifiy savol"},
 t100:{title:"100 talik test",n:100,min:180,desc:"100 ta tasodifiy savol, barcha bo‘limlardan"},
 m400:{title:"400 talik marafon",n:400,min:180,desc:"Barcha savollar, aralashtirilgan tartibda"}};
function startExam(kind,secId){
  let qs,title,min;
  if(kind==='sec'){qs=shuffle(QS.filter(q=>q.sec===secId));title=SECS[secId-1].name;min=Math.max(10,Math.round(qs.length*0.9));}
  else if(kind==='wrong'){const w=QS.filter(q=>D.latest[q.id]===0);if(!w.length){toast("Xato qilingan savollar yo‘q");return}qs=shuffle(w);title="Xatolar ustida ishlash";min=Math.max(10,Math.round(qs.length*0.9));}
  else{const m=MODES[kind];qs=shuffle(QS).slice(0,m.n);title=m.title;min=m.min;}
  exam={kind,secId:secId||0,title,items:buildItems(qs),cur:0,start:Date.now(),deadline:Date.now()+min*60000,min};
  saveExam();view='exam';mapOpen=false;render();startTick();window.scrollTo(0,0);
}
const saveExam=()=>exam?st.set('kmt_exam_'+me.email,exam):0;
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!exam)return clearInterval(tick);
  const left=exam.deadline-Date.now();const el=document.getElementById('timer');
  if(left<=0){finish(true);return}
  if(el){el.textContent=fmt(left);el.classList.toggle('low',left<300000)}},500)}
const fmt=ms=>{ms=Math.max(0,Math.round(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m<1?'1 daqiqadan kam':m+' daq'};

function finish(auto){
  clearInterval(tick);
  const e=exam;const bySec={};SECS.forEach(s=>bySec[s.id]={c:0,t:0});
  let c=0,skipped=0;
  e.items.forEach(it=>{const q=QS[it.id-1];const ok=it.ans>=0&&it.order[it.ans]===q.a;
    bySec[q.sec].t++;if(ok){c++;bySec[q.sec].c++}if(it.ans<0)skipped++;
    D.latest[q.id]=ok?1:0;});
  const used=Math.min(Date.now(),e.deadline)-e.start;
  const rec={t:Date.now(),kind:e.kind,title:e.title,n:e.items.length,c,skipped,pct:Math.round(c/e.items.length*100),dur:used,bySec};
  D.attempts.push(rec);saveData();st.del('kmt_exam_'+me.email);
  result={rec,items:e.items,auto};exam=null;modal=null;view='result';resFilter='all';render();window.scrollTo(0,0);
}

/* ---------- analytics ---------- */
function stats(){
  const per=SECS.map(s=>{const qs=QS.filter(q=>q.sec===s.id);let att=0,ok=0;
    qs.forEach(q=>{const v=D.latest[q.id];if(v!==undefined){att++;ok+=v}});
    return {s,total:qs.length,att,ok,acc:att?ok/att:0,mastery:ok/qs.length,cov:att/qs.length}});
  const att=per.reduce((a,p)=>a+p.att,0),ok=per.reduce((a,p)=>a+p.ok,0);
  const acc=att?ok/att:0,cov=att/QS.length;
  const readiness=Math.round(acc*(0.4+0.6*cov)*100);
  return {per,att,ok,acc,cov,readiness};
}
const levelOf=r=>r>=85?"Imtihonga tayyor":r>=65?"Yaxshi daraja":r>=40?"O‘rta daraja":"Boshlang‘ich daraja";

/* ---------- views ---------- */
function topbar(){
  const nav=[['home','Bosh sahifa'],['dash','Kabinet']];
  return `<div class="top"><div class="top-in">
   <button class="brand" data-go="home"><span class="logo">K</span>Kelajak testlari</button>
   <div class="nav" role="navigation">${nav.map(([k,t])=>`<button data-go="${k}" ${view===k?'aria-current="page"':''}>${t}</button>`).join('')}</div>
   <div class="user"><span class="av" style="background:${colorFor(me.email)}">${esc(initials(me.name))}</span><span>${esc(me.name)}</span>
   <button class="btn sm" id="logout">Chiqish</button></div></div></div>`;
}
const money=n=>Number(n).toLocaleString('en-US').replace(/,/g,' ')+" so‘m";
function vLogin(){
  return `<div class="login"><div class="card">
   <div><div class="logo" style="width:40px;height:40px;font-size:1.2rem;margin-bottom:12px">K</div>
   <h1 style="font-size:1.7rem">Kelajak markazlari test tizimi</h1>

function ring(pct,size=150,label=true){
  const r=size/2-12,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="${size*0.27}">${pct}%</text>`:''}</svg>`;
}

function lineChart(pts){
  if(pts.length<1)return '<p class="muted">Hali test ishlanmagan. Birinchi testdan keyin grafik shu yerda paydo bo‘ladi.</p>';
  const W=560,H=220,pl=36,pr=14,pt=14,pb=26;
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1), y=v=>pt+(100-v)*(H-pt-pb)/100;
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)}" text-anchor="end" dominant-baseline="central" fill="var(--muted)" font-size="11">${v}</text>`});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.pct)).join(' ');
  const area=pts.length>1?`<path d="${path} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--accent)" opacity=".12"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.pct)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>${p.pct}% — ${esc(p.title)}</title></circle>`).join('');
  const last=pts[pts.length-1];
  const lx=Math.min(x(pts.length-1),W-pr-14);
  const xl=pts.map((p,i)=>(pts.length<=10||i%2===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="var(--muted)" font-size="11">${i+1}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Test ballari dinamikasi">${g}${area}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${lx}" y="${y(last.pct)-12}" text-anchor="middle" fill="var(--ink)" font-weight="700" font-size="12">${last.pct}%</text>${xl}</svg>`;
}

    ${at.length?`<div class="tbl"><table><thead><tr><th>№</th><th>Sana</th><th>Test</th><th>To‘g‘ri</th><th>Ball</th><th>Vaqt</th></tr></thead><tbody>${[...at].map((a,i)=>({a,i})).reverse().slice(0,30).map(({a,i})=>`<tr><td>${i+1}</td><td>${new Date(a.t).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(a.title)}</td><td>${a.c}/${a.n}</td><td><b>${a.pct}%</b></td><td>${fmtDur(a.dur)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Hali test ishlanmagan.</p>'}
    ${at.length?`<div class="row" style="margin-top:12px"><button class="btn sm" id="reset">Natijalarni tozalash</button></div>`:''}</div>
   ${modal==='reset'?`<div class="modal"><div class="card"><h2 style="font-size:1.3rem">Barcha natijalar o‘chirilsinmi?</h2><p>Test tarixi va tayyorgarlik ko‘rsatkichi nolga qaytadi.</p><div class="row"><button class="btn danger" id="confirmreset">O‘chirish</button><button class="btn" id="cancel">Bekor qilish</button></div></div></div>`:''}`;
}
function render(){

  if(!me){$.innerHTML=`<div class="wrap">${vLogin()}</div>`;bind();mountGoogle();return}
  if(!me.paid){$.innerHTML=`<div class="wrap">${vPay()}</div>`;bind();return}
  if(qLoading||!QS.length){$.innerHTML=`<div class="wrap">${vLoading(loginMsg||'Savollar yuklanmoqda…')}</div>`;return}
  let body='';

function toast(t){clearTimeout(toastT);let el=document.querySelector('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);toastT=setTimeout(()=>el.remove(),2200)}
let gReady=false;
function mountGoogle(){
  const host=document.getElementById('ghost');if(!host)return;
  const go=()=>{
    if(!gReady){google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:onGoogle,auto_select:false});gReady=true}
    google.accounts.id.renderButton(host,{theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:Math.min(300,host.parentElement.clientWidth||300),locale:'uz'});
  };
  if(window.google&&google.accounts&&google.accounts.id)go();
  else{let n=0;const iv=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.id){clearInterval(iv);go()}else if(++n>60){clearInterval(iv);const e=document.getElementById('lerr');if(e)e.textContent='Google kirish yuklanmadi. Internetni tekshirib, sahifani yangilang.'}},250)}
}
async function onGoogle(resp){
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({credential:resp.credential})});
    token=r.token;st.set('kmt_token',token);me=r.user;loginMsg='';await afterAuth();
  }catch(e){loginMsg=e.message;const el=document.getElementById('lerr');if(el)el.textContent=loginMsg}
}
async function afterAuth(){
  loadData();view='home';
  if(me.paid)await loadQuestions();
  render();window.scrollTo(0,0);
}
async function loadQuestions(){
  qLoading=true;loginMsg='';render();
  try{const r=await api('/api/questions');QS=r.rows.map((r,i)=>({id:i+1,sec:r[0],q:r[1],o:r[2],a:r[3],e:r[4]||""}))}
  catch(e){if(e.status===402){me.paid=false}else loginMsg='Savollarni yuklab bo‘lmadi: '+e.message}
  qLoading=false;
}
async function refreshMe(){const r=await api('/api/me');me=r.user;price=r.price_uzs;return me}
async function startPayment(){
  const b=document.getElementById('paybtn');if(b){b.disabled=true;b.textContent='Payme ochilmoqda…'}
  try{const r=await api('/api/order',{method:'POST'});window.location.href=r.url}
  catch(e){loginMsg=e.message;render()}
}
async function pollPaid(tries){
  for(let i=0;i<tries;i++){
    try{await refreshMe();if(me.paid){await afterAuth();return true}}catch(e){}
    await new Promise(r=>setTimeout(r,3000));
  }
  return false;
}
function bind(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(exam&&view==='exam')return;view=b.dataset.go;render();window.scrollTo(0,0)});
  on('paybtn',startPayment);
  on('checkpay',async()=>{const e=document.getElementById('lerr');if(e)e.textContent='Tekshirilmoqda…';
    try{await refreshMe();if(me.paid)await afterAuth();else{loginMsg='To‘lov hali qabul qilinmagan. To‘lagan bo‘lsangiz, 1 daqiqa kutib qayta bosing.';render()}}catch(x){loginMsg=x.message;render()}});
  on('logout',()=>{clearInterval(tick);st.del('kmt_token');token=null;me=null;D=null;exam=null;QS=[];view='login';try{google.accounts.id.disableAutoSelect()}catch(e){}render()});
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startExam(b.dataset.start));
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>startExam('sec',+b.dataset.sec));
  on('resume',()=>{const s=st.get('kmt_exam_'+me.email);if(s){exam=s;view='exam';render();startTick()}});
  on('dropresume',()=>{st.del('kmt_exam_'+me.email);render()});
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const it=exam.items[exam.cur];it.ans=+b.dataset.opt;saveExam();render()});
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{exam.cur=+b.dataset.jump;mapOpen=false;saveExam();render();window.scrollTo(0,0)});
  on('prev',()=>{exam.cur--;saveExam();render();window.scrollTo(0,0)});
  on('next',()=>{if(exam.cur===exam.items.length-1){modal='finish';render()}else{exam.cur++;saveExam();render();window.scrollTo(0,0)}});
  on('flag',()=>{const it=exam.items[exam.cur];it.flag=!it.flag;saveExam();render()});
  on('clear',()=>{exam.items[exam.cur].ans=-1;saveExam();render()});
  on('finish',()=>{modal='finish';render()});
  on('confirm',()=>finish(false));
  on('mapbtn',()=>{mapOpen=true;render()});on('mapclose',()=>{mapOpen=false;render()});on('sbg',()=>{mapOpen=false;render()});
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{resFilter=b.dataset.rf;render()});
  on('reset',()=>{modal='reset';render()});
  on('confirmreset',()=>{D={attempts:[],latest:{}};saveData();modal=null;toast('Natijalar tozalandi');render()});
}
document.addEventListener('keydown',e=>{
  if(view!=='exam'||!exam||modal||/INPUT/.test(document.activeElement.tagName))return;
  const k=e.key.toUpperCase();const p=['A','B','C','D','1','2','3','4'].indexOf(k);
  if(p>=0){exam.items[exam.cur].ans=p%4;saveExam();render()}
  else if(e.key==='ArrowRight'&&exam.cur<exam.items.length-1){exam.cur++;saveExam();render()}
  else if(e.key==='ArrowLeft'&&exam.cur>0){exam.cur--;saveExam();render()}
});
/* boot */
(async function(){
  const returned=new URLSearchParams(location.search).get('payme')==='return';
  try{const i=await api('/api/info');price=i.price_uzs}catch(e){}
  if(token){
    try{
      await refreshMe();
      if(returned)history.replaceState(null,'',location.pathname);
      if(!me.paid&&returned){booting=false;$.innerHTML=`<div class="wrap">${vLoading('To‘lov tekshirilmoqda…')}</div>`;loadData();await pollPaid(10)}
      else await afterAuth();
    }catch(e){if(e.status===401){st.del('kmt_token');token=null;me=null}else{loginMsg=e.message}}
  }
  booting=false;render();
})();
</script>
